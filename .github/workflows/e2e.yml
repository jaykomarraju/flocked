# Playwright over the local stack, two suites, each on a fresh stack of its own (the two-phase rule:
# e2e/playwright.config.ts, e2e/stack/README.md "Playwright specs").
# - `api` (W7-D): the API-level lifecycle specs in e2e/tests/*.spec.ts. Project `api` runs every spec's
#   rounds (a Free and Stakes daily round with no manual step, identical Stakes ciphertexts, the drand
#   outage's rule-8 refund, and the Stakes rounds that later need a warp: claims, a vetoed refund
#   proposal, the refund timeout); `api-warp` then moves anvil's clock past the challenge window and
#   the 72 h timeout, which can't be undone.
# - `ui` (W8-C): the web app's browser specs in e2e/ui/*.spec.ts that need the stack: axe on the
#   app's screens and sign-in end to end. The app is built before the stack starts, so the API Worker
#   serves it at APP_ORIGIN.
# - `screens` (W8-C): the @screenshot tests (the web app's design sheets against the Paper exports) on
#   macOS, with no stack: Paper renders its exports with Chromium on a Mac, and Linux's FreeType text
#   differs from them by 1.5-2.4% of pixels (W8-C's first run), over the pinned 1%.
# Like the Stack workflow, it runs on integration branches and main only: the stack takes a minute to
# start and a round several to settle. Playwright's globalTimeout (40 min) ends a stuck run before the
# job's 45, so the report is still uploaded.
name: E2E

on:
  push:
    branches: [main, 'w*-integration']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    # ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026; pin ubuntu-24.04 if the stack breaks there.
    runs-on: ubuntu-latest
    # W10-D pushed the formerly ~28-minute suite past the 35-minute safety line. Each group keeps
    # every file's api/api-warp phases together on its own fresh stack.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            files: >-
              tests/lifecycle.spec.ts tests/notifications.spec.ts tests/paymaster.spec.ts
              tests/rooms.spec.ts tests/stakes-copy.spec.ts tests/verify-cli.spec.ts
              tests/watcher.spec.ts
          - group: warp
            files: >-
              tests/drand-outage.spec.ts tests/stakes-claims.spec.ts
              tests/stakes-timeout.spec.ts tests/stakes-veto.spec.ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: forge soldeer install
        working-directory: contracts
      - run: pnpm stack:up
      - run: pnpm --filter @flocked/e2e exec playwright test ${{ matrix.files }} --project=api --project=api-warp --no-deps
        env:
          CI: 'true'
      - name: Stack status and drand logs
        if: failure() || cancelled()
        run: |
          pnpm stack:status || true
          docker compose -f e2e/stack/docker-compose.yml logs --tail 100
      - name: Upload the Playwright report and stack logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.group }}-report
          path: |
            playwright-report
            test-results
            e2e/stack/.run/logs
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: pnpm stack:down

  ui:
    # ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026; pin ubuntu-24.04 if the stack breaks there.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: forge soldeer install
        working-directory: contracts
      - name: Install Chromium for Playwright
        run: pnpm --filter @flocked/e2e exec playwright install --with-deps chromium
      # The app first, so the stack's API Worker serves it (and its design sheets) at APP_ORIGIN.
      - run: pnpm --filter @flocked/web build:e2e
      - run: pnpm stack:up
      # The @screenshot tests run in the screens job, on macOS.
      - run: pnpm --filter @flocked/e2e exec playwright test --project=ui --project=ui-warp --grep-invert @screenshot
        env:
          CI: 'true'
      - name: Stack status and drand logs
        if: failure() || cancelled()
        run: |
          pnpm stack:status || true
          docker compose -f e2e/stack/docker-compose.yml logs --tail 100
      - name: Upload the Playwright report and stack logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ui-report
          path: |
            playwright-report
            test-results
            e2e/stack/.run/logs
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: pnpm stack:down

  screens:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @flocked/e2e exec playwright install chromium
      - run: pnpm e2e:screens
        env:
          CI: 'true'
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screens-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
