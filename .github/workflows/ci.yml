name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Settlement vectors are fresh
        run: pnpm --filter @flocked/settle --fail-if-no-match vectors && git diff --exit-code packages/settle/vectors
      - name: Target-round vectors are fresh
        run: pnpm --filter @flocked/tlock --fail-if-no-match vectors && git diff --exit-code packages/tlock/vectors
      - name: Design tokens match the P2.3 schema
        run: pnpm --filter @flocked/shared --fail-if-no-match exec vitest run test/tokens.test.ts

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge soldeer install
      - run: forge fmt --check
      - run: forge build
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generated ABIs are current
        run: node ../packages/abi/scripts/gen.mjs --check
      # Foundry 1.7 has no `--profile` flag; the `ci` profile is selected through the environment.
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci

  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run by path, not `-t property`: a renamed test then fails here instead of silently running nothing.
      - run: pnpm --filter @flocked/settle --fail-if-no-match exec vitest run test/properties.test.ts
        env:
          FAST_CHECK_RUNS: '10000'
      - run: pnpm --filter @flocked/tlock --fail-if-no-match exec vitest run --project node test/plaintext.test.ts
        env:
          FAST_CHECK_RUNS: '10000'
