# Local stack tests (e2e/stack/README.md): drand in Docker, anvil, the CREATE2 deploy, `wrangler dev`
# (the API with the ticket signer beside it) and the cron driver, then the stack tests: one real Free
# round end to end (smoke), the round lifecycle with no manual step, a 50-entry Free round settled
# and anchored, the anvil-backed anchor and indexer tests, Stakes tickets through the API's signer
# binding, and a Stakes round settled (last: it moves anvil's clock for good). Runs on integration
# branches and main only, as the stack takes a minute to start and a round another to reach its
# beacon.
name: Stack

on:
  push:
    branches: [main, 'w*-integration']
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026; pin ubuntu-24.04 if the stack breaks there.
    runs-on: ubuntu-latest
    # The test steps take about 10 minutes on the owner's Mac (W6-D), stakes-settle alone 3.5.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: forge soldeer install
        working-directory: contracts
      - run: pnpm stack:up
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/stack-smoke.test.ts
      # A daily-shaped round through lock → open → close → commit, moved only by the stack's cron
      # driver and the DOs' alarms (W4-D; AC-6, first half).
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/lifecycle-open-close.test.ts
      # A Free round with 50 entries settles after its beacon: the bundle in R2, the ledger applied,
      # the manifest anchored (W5-D).
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/free-settle.test.ts
      # These sign with the stack's anchor and operator keys and turn automine off or revert
      # snapshots, so each runs on its own step (W4-A, W4-B).
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/anchor-tx.test.ts
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/indexer-reorg.test.ts
      # Stakes tickets from the signer's code, then through the API's SIGNER binding (W6-B, W6-D).
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/stakes-ticket.test.ts
      # A Stakes round settles (W6-A); it moves anvil's clock 2 h forward for good, so it comes last.
      - run: pnpm --filter @flocked/e2e --fail-if-no-match exec vitest run tests/stakes-settle.test.ts
      # A later claims-* step (W6-D) goes after stakes-settle and builds on its round.
      - name: Stack status and drand logs
        if: failure()
        run: |
          pnpm stack:status || true
          docker compose -f e2e/stack/docker-compose.yml logs --tail 100
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: e2e/stack/.run/logs
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: pnpm stack:down
