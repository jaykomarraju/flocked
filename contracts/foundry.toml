[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["dependencies"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "../packages/settle/vectors" },
  { access = "read", path = "../packages/abi/test/fixtures" },
  { access = "read", path = "../packages/tlock/vectors" },
  { access = "read", path = "../packages/shared/test/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 512
depth = 200
fail_on_revert = true

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"

[fmt]
line_length = 120

[lint]
# Every deadline in the escrow is timestamp-based by design (spec "Smart contract").
exclude_lints = ["block-timestamp"]
# Tests cast already-bounded fuzz inputs; lint the production sources only.
ignore = ["test/**/*.sol"]
